<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twiga Data Bridge - POS Analytics</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">
  <div class="max-w-4xl mx-auto p-4 sm:p-6">
    <header class="flex items-center justify-between pb-6 border-b border-slate-800">
      <div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Twiga Data Bridge</h1>
        <p class="text-xs text-slate-400">Simba POS Intelligence Command Center</p>
      </div>
      <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">Live Sync</span>
    </header>

    <!-- Metrics Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-6">
      <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
        <span class="text-xs text-slate-400 font-medium">Top Selling Product</span>
        <p id="topProduct" class="text-lg font-bold text-white mt-1">Loading...</p>
      </div>
      <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
        <span class="text-xs text-slate-400 font-medium">Units Sold</span>
        <p id="totalUnits" class="text-lg font-bold text-white mt-1">0</p>
      </div>
      <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50">
        <span class="text-xs text-slate-400 font-medium">Total Gross Volume</span>
        <p id="totalRevenue" class="text-lg font-bold text-emerald-400 mt-1">KSh 0</p>
      </div>
    </div>

    <!-- Chart -->
    <div class="bg-slate-800/60 p-4 rounded-xl border border-slate-700/50 mt-6">
      <h2 class="text-sm font-semibold text-slate-200 mb-4">Revenue Breakdown by Product</h2>
      <div class="relative h-64 sm:h-80">
        <canvas id="salesChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    }

    // --- INSERT YOUR SUPABASE CREDENTIALS HERE ---
    const SUPABASE_URL = 'https://ofyrcyrzdeqacbatpgyk.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9meXJjeXJ6ZGVxYWNiYXRwZ3lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1MzM2MjAsImV4cCI6MjEwNjEwOTYyMH0.vxtZbc48Wz5X8BI7knJJjPBedfNk0JjJja5VM6ByPSU';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadDashboard() {
      const { data, error } = await supabaseClient
        .from('daily_aggregates')
        .select('metric_label, total_volume, total_count')
        .eq('metric_type', 'PRODUCT_PERFORMANCE')
        .order('total_volume', { ascending: false });

      if (error) {
        console.error('Fetch error:', error);
        return;
      }

      if (!data || data.length === 0) return;

      document.getElementById('topProduct').textContent = data[0].metric_label;
      const totalUnits = data.reduce((sum, item) => sum + item.total_count, 0);
      const totalRev = data.reduce((sum, item) => sum + parseFloat(item.total_volume), 0);

      document.getElementById('totalUnits').textContent = totalUnits.toLocaleString();
      document.getElementById('totalRevenue').textContent = `KSh ${totalRev.toLocaleString()}`;

      const labels = data.map(d => d.metric_label);
      const volumes = data.map(d => d.total_volume);

      const ctx = document.getElementById('salesChart').getContext('2d');
      new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: 'Gross Volume (KSh)',
            data: volumes,
            backgroundColor: '#3b82f6',
            borderRadius: 6
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
            y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
          }
        }
      });
    }

    loadDashboard();
  </script>
</body>
</html>
