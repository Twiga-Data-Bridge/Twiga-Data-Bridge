<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Twiga Data Bridge | Retail Intelligence</title>

  <!-- PWA & Mobile Web Capabilities -->
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <meta name="theme-color" content="#EDE5C8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="TwigaBridge">

  <!-- Favicon and iOS Home Icons -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Preconnect to Supabase -->
  <link rel="preconnect" href="https://ofyrcyrzdeqacbatpgyk.supabase.co" crossorigin>
  <link rel="dns-prefetch" href="https://ofyrcyrzdeqacbatpgyk.supabase.co">
  
  <!-- CDNs: Tailwind CSS, Supabase JS v2, Chart.js -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'canvas': '#F5F2E8',
            'vanilla': '#EDE5C8',
            'charcoal': '#3E3E3C',
            'sea-green': '#228D57',
            'willow': '#85BB65',
            'gold': '#D4AF37'
          }
        }
      }
    }
  </script>

  <script src="app.js" defer></script>
</head>
<body class="min-h-screen pt-safe selection:bg-sea-green selection:text-white">

  <!-- Main Content Stacking Layer -->
  <div class="max-w-4xl mx-auto px-4 sm:px-6 pt-6 main-content-layer">

    <!-- Boxed Header Container -->
    <header class="flex flex-col sm:flex-row sm:items-center justify-between pb-6 border-b border-charcoal/10 gap-4">
      <div class="card-vanilla px-4 py-3 sm:px-5 sm:py-3.5 rounded-2xl border border-charcoal/10 flex items-center gap-3.5 shadow-sm max-w-fit">
        <div class="w-8 h-8 rounded-xl bg-sea-green/15 flex items-center justify-center shrink-0 border border-sea-green/20">
          <span class="w-2.5 h-2.5 rounded-full bg-sea-green"></span>
        </div>
        <div>
          <h1 class="text-base sm:text-lg font-black tracking-tight text-charcoal uppercase leading-tight">
            Twiga Data Bridge
          </h1>
          <p class="text-[11px] text-charcoal/70 tracking-wide font-semibold mt-0.5">
            Simba POS Intelligence Console
          </p>
        </div>
      </div>

      <div class="flex items-center gap-2 self-start sm:self-auto">
        <!-- Install App Button -->
        <button id="pwaInstallBtn" onclick="triggerPwaInstall()" class="hidden card-vanilla px-3.5 py-2 rounded-full border border-sea-green/30 shadow-sm flex items-center gap-2 hover:bg-sea-green/10 active:scale-95 transition-all duration-200 cursor-pointer">
          <svg class="w-3.5 h-3.5 text-sea-green" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>
          </svg>
          <span class="text-xs font-black text-sea-green uppercase tracking-wider">Install App</span>
        </button>

        <!-- Cloud Sync Status Pill -->
        <div class="flex items-center gap-2 bg-vanilla px-3.5 py-2 rounded-full border border-charcoal/10 shadow-sm">
          <span class="w-2 h-2 rounded-full bg-willow animate-ping"></span>
          <span id="syncBadge" class="text-xs font-bold text-charcoal uppercase tracking-wider">Cloud Sync</span>
        </div>
      </div>
    </header>

    <!-- Error Banner -->
    <div id="errorBanner" class="hidden mt-4 p-4 rounded-xl bg-red-100 border border-red-300 text-charcoal text-xs font-semibold"></div>

    <!-- ========================================== -->
    <!-- VIEW PANEL 1: OVERVIEW                     -->
    <!-- ========================================== -->
    <main id="panel-overview" class="space-y-6 mt-6">
      
      <!-- TOP VOLUME SKU: Demand Profile Radar Card -->
      <section class="card-vanilla p-6 sm:p-7 rounded-3xl border border-charcoal/5 relative overflow-hidden">
        <div class="flex justify-between items-start">
          <div>
            <div class="flex items-center gap-2">
              <span class="text-xs font-extrabold uppercase tracking-wider text-charcoal/70">Top Volume SKU</span>
              <span class="gold-badge text-[10px] font-black uppercase px-2.5 py-0.5 rounded shadow-sm">Leader</span>
            </div>
            <h2 id="radarSkuTitle" class="text-2xl sm:text-3xl font-black text-charcoal mt-2 tracking-tight">
              Loading...
            </h2>
            <p class="text-xs font-semibold text-sea-green mt-0.5">Highest checkout demand across trading shifts</p>
          </div>
        </div>

        <!-- 3-Column Metrics Ribbon -->
        <div class="grid grid-cols-3 gap-2 sm:gap-4 mt-5 p-3.5 bg-canvas/70 rounded-2xl border border-charcoal/5 text-center">
          <div>
            <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-charcoal/60">Dispatched</span>
            <p id="radarUnits" class="text-lg sm:text-xl font-black text-sea-green mt-0.5">--</p>
          </div>
          <div class="border-x border-charcoal/10 px-1">
            <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-charcoal/60">Volume Share</span>
            <p id="radarShare" class="text-lg sm:text-xl font-black text-charcoal mt-0.5">--%</p>
          </div>
          <div>
            <span class="text-[10px] sm:text-xs font-bold uppercase tracking-wider text-charcoal/60">Peak Window</span>
            <p id="radarPeak" class="text-sm sm:text-lg font-black text-gold mt-0.5 leading-tight">--</p>
          </div>
        </div>

        <!-- 8-Axis Radar Canvas Container -->
        <div class="mt-6 pt-5 border-t border-charcoal/10">
          <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1 mb-
